<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eurolux Internal Glazing Project Tracker</title>
<meta name="description" content="Track internal glazing work — partitions, doors, showers and balustrades — from site, online or off.">

<meta name="theme-color" content="#23262B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eurolux Glazing">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="root">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mark"><span class="edge"></span><div><h1>Eurolux Glazing Tracker</h1></div></div>
      <p class="tag">Loading…</p>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:sans-serif">This app needs JavaScript enabled.</p>
</noscript>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
